name: Auto Build & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build, Test & Export Standalone HTML
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check (lint)
        run: npm run lint

      - name: Run unit tests
        run: npx tsx --test src/game/rules.test.ts

      - name: Build web bundle & offline exports
        run: npm run export

      - name: Upload standalone HTML & Electron payload
        uses: actions/upload-artifact@v6
        with:
          name: web-release-assets
          retention-days: 7
          path: |
            public/downloads/NEGRUZINO.html
            public/downloads/NEGRUZINO-Desktop-EXE-Project.zip
            desktop-electron/app.html

  build-windows-exe:
    name: Build Windows Portable .EXE
    runs-on: windows-latest
    needs: build-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Download built app.html
        uses: actions/download-artifact@v7
        with:
          name: web-release-assets
          path: _artifacts

      - name: Place app.html into desktop-electron
        shell: pwsh
        run: Copy-Item -Force "_artifacts/desktop-electron/app.html" "desktop-electron/app.html"

      - name: Install Electron builder dependencies
        working-directory: desktop-electron
        run: npm install --no-audit --no-fund

      - name: Build portable NEGRUZINO.exe
        working-directory: desktop-electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist

      - name: Upload Windows .EXE artifact
        uses: actions/upload-artifact@v6
        with:
          name: windows-exe-asset
          retention-days: 7
          path: desktop-electron/dist/NEGRUZINO.exe

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-and-test
      - build-windows-exe
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download all release artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-files

      - name: Prepare release metadata & files
        id: meta
        shell: bash
        run: |
          mkdir -p release-upload
          cp release-files/web-release-assets/public/downloads/NEGRUZINO.html release-upload/NEGRUZINO.html
          cp release-files/web-release-assets/public/downloads/NEGRUZINO-Desktop-EXE-Project.zip release-upload/NEGRUZINO-Desktop-EXE-Project.zip
          cp release-files/windows-exe-asset/NEGRUZINO.exe release-upload/NEGRUZINO.exe

          SHORT_SHA="${GITHUB_SHA::7}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
            RELEASE_NAME="НЕГРУЗИНО.EXE // ${TAG_NAME}"
          else
            TAG_NAME="v1.0.${GITHUB_RUN_NUMBER}"
            RELEASE_NAME="НЕГРУЗИНО.EXE // ${TAG_NAME} (${SHORT_SHA})"
          fi

          echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "name=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          generate_release_notes: true
          make_latest: true
          body: |
            Автоматическая сборка **НЕГРУЗИНО.EXE // 1994** из коммита `${{ github.sha }}`.

            ### Файлы релиза
            - **`NEGRUZINO.exe`** — готовый портативный исполняемый файл для Windows x64 (запуск в 1 клик, без установки).
            - **`NEGRUZINO.html`** — автономная браузерная версия в одном HTML-файле (работает офлайн на Windows, macOS, Linux).
            - **`NEGRUZINO-Desktop-EXE-Project.zip`** — исходники Electron-обёртки для локальной пересборки `.exe`.
          files: |
            release-upload/NEGRUZINO.exe
            release-upload/NEGRUZINO.html
            release-upload/NEGRUZINO-Desktop-EXE-Project.zip
